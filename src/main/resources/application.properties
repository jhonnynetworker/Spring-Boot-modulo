# Permitir conexões de qualquer IP (para desenvolvimento)
#server.address=0.0.0.0

# Porta (use uma fixa para facilitar)
server.port=8000

# Se precisar de HTTPS
# server.ssl.enabled=true
# server.port=8443

# ===== Configuração de Banco de Dados =====

# H2 (Banco em memória para testes) - ATIVO
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ===== Configuração do JPA/Hibernate =====

# Atualizar schema automaticamente (create, update, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL no console
spring.jpa.show-sql=true

# Formatar SQL no console
spring.jpa.properties.hibernate.format_sql=true

